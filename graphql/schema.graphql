# Read-only GraphQL layer in front of the existing REST API.
#
# REST stays the write path: these queries only cover three read scenarios
# where a single round trip is worth more than one endpoint per resource:
#
# 1. `churchMember`  - church-member detail page (member + logs + medals).
# 2. `roleIndex`     - role list + permission catalog for the role comboboxes.
# 3. `publicContent` - public/landing reads (testimonies, events, carousel,
#                      professionals).

"Arbitrary JSON value, used for `ChurchMemberMedal.description`."
scalar JSON @scalar(class: "App\\GraphQL\\Scalars\\JSON")

type Query {
  """
  Church-member detail payload: member, tracking logs, consolidator logs and
  medals in one request. Returns null when the member does not exist or is
  outside the caller's organization scope.
  """
  churchMember(id: ID!): ChurchMemberDetail
    @guard
    @field(resolver: "App\\GraphQL\\Queries\\ChurchMemberDetail")

  """
  Role list plus the full permission-name catalog (the combobox source) in
  one request.
  """
  roleIndex(
    page: Int
    itemsPerPage: Int
    filter: String
    sortBy: [String!]
    sortDesc: [Boolean!]
  ): RoleIndexPayload!
    @guard
    @field(resolver: "App\\GraphQL\\Queries\\RoleIndex")

  "Public landing content. No authentication required."
  publicContent(
    orgId: String
    testimonyPage: Int
    testimonyItemsPerPage: Int
    testimonyFilter: String
    eventStartDate: String
    eventEndDate: String
    eventSearch: String
    eventNextDays: Int
    includeCarousel: Boolean = true
    carouselNextDays: Int
    professionalPage: Int
    professionalItemsPerPage: Int
    professionalFilter: String
  ): PublicContent!
    @field(resolver: "App\\GraphQL\\Queries\\PublicContent")
}

# ---------------------------------------------------------------------------
# Church-member detail
# ---------------------------------------------------------------------------

type ChurchMemberDetail {
  member: ChurchMember!
  trackingLogs: TrackingLogPage!
  consolidatorLogs: [ConsolidatorLog!]!
  medals: [Medal!]!
}

type ChurchMember {
  id: Int!
  org_id: Int
  conso_sheet_id: Int
  name: String
  last_name: String
  second_last_name: String
  years_old: Int
  number_of_children: Int
  cellphone: String
  address: String
  marriage_status: String
  status: String
  created_by: Int
  "Temporary S3 URL, resolved by the `url_image_s3` model accessor."
  url_image_s3: String
  created_at: String
  updated_at: String
  creator: UserRef
  consolidators: [UserRef!]!
}

type UserRef {
  id: Int!
  name: String
  last_name: String
  second_last_name: String
  email: String
}

type TrackingLogPage {
  data: [TrackingLog!]!
  total: Int!
  itemsPerPage: Int!
}

type TrackingLog {
  id: Int!
  church_member_id: Int
  contact_datetime: String
  medium: String
  classification: String
  description: String
  created_by: Int
  created_at: String
  updated_at: String
  creator: UserRef
  church_member: TrackingLogMember
}

type TrackingLogMember {
  id: Int!
  name: String
  last_name: String
  cellphone: String
}

type ConsolidatorLog {
  id: Int!
  church_member_id: Int
  consolidator_id: Int
  action: String
  changed_by: Int
  created_at: String
  updated_at: String
  consolidator: UserRef
  changer: UserRef
}

type Medal {
  id: Int!
  church_member_id: Int
  medal: String
  description: JSON
  created_by: Int
  created_at: String
  updated_at: String
  creator: UserRef
}

# ---------------------------------------------------------------------------
# Role list + permission catalog
# ---------------------------------------------------------------------------

type RoleIndexPayload {
  roles: RolePage!
  "Names of every permission, ordered by name (combobox source)."
  permissionNames: [String!]!
}

type RolePage {
  data: [Role!]!
  total: Int!
  itemsPerPage: Int!
}

type Role {
  id: Int!
  name: String!
  guard_name: String
  permissions: [PermissionRef!]!
}

type PermissionRef {
  id: Int!
  name: String!
}

# ---------------------------------------------------------------------------
# Public content
# ---------------------------------------------------------------------------

type PublicContent {
  testimonies: TestimonyPage!
  events: [PublicEvent!]!
  "Null when `includeCarousel` is false."
  carousel: [PublicEvent!]
  professionals: ProfessionalPage!
}

type TestimonyPage {
  data: [PublicTestimony!]!
  total: Int!
  itemsPerPage: Int!
  current_page: Int!
}

type PublicTestimony {
  name: String
  categories: [String!]
  link: String
  description: String
  created_at: String
}

type PublicEvent {
  id: Int!
  name: String
  slug_name: String
  location: String
  description: String
  publish_date: String
  event_date: String
  time_start: String
  url_image_s3: String
  classification: String
  org_id: Int
  created_by: Int
  created_at: String
  updated_at: String
}

type ProfessionalPage {
  data: [PublicProfessional!]!
  total: Int!
  itemsPerPage: Int!
  current_page: Int!
}

type PublicProfessional {
  id: Int!
  name: String
  last_name: String
  phone_number: String
  title: String
  description: String
  status: String
  created_at: String
}
